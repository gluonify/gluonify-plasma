# The redaction filter of gluonify-plasma-logging on every handler a service may write to (ordinal 100: a service can still override it
# in its application.properties, which it must not do without a reason). The OIDC category stays at ERROR in each service as well.
quarkus.log.console.filter=gluonify-jws-redaction
quarkus.log.file.filter=gluonify-jws-redaction
quarkus.log.syslog.filter=gluonify-jws-redaction
